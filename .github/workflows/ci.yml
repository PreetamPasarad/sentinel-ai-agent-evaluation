name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate evaluation fixtures
        run: python scripts/validate_fixtures.py

      - name: Validate required project files
        run: |
          test -f index.html
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f docs/architecture.md
